services:
  app:
    image: mirror:local
    build:
      context: .
      target: production
    init: true
    restart: unless-stopped
    env_file:
      - .env.local
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: "3000"
      TTS_BASE_URL: ${TTS_BASE_URL:-http://tts:8000}
    depends_on:
      tts:
        condition: service_healthy
    networks:
      - default
      - speech
    expose:
      - "3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000'+(process.env.NEXT_PUBLIC_BASE_PATH||'')+'/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      start_period: 30s
      retries: 6

  tts:
    image: mirror:tts-local
    platform: linux/amd64
    build:
      context: ./services/tts
      target: runtime
    init: true
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:exec,size=32m,uid=1000,gid=1000,mode=0700
    environment:
      TTS_THREADS: ${TTS_THREADS:-4}
    cpus: 4.0
    mem_limit: 2g
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    networks:
      - speech
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=2).read()"]
      interval: 5s
      timeout: 3s
      start_period: 90s
      retries: 6

  caddy:
    image: caddy:2.11.2-alpine@sha256:834468128c7696cec0ceea6172f7d692daf645ae51983ca76e39da54a97c570d
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    environment:
      APP_HOST: ${APP_HOST:-localhost}
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${HTTPS_PORT:-8443}:443"
    volumes:
      - ./docker/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  caddy_data:
  caddy_config:

networks:
  speech:
    internal: true
